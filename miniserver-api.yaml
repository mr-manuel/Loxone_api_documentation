openapi: 3.1.0
info:
  title: Loxone MiniServer API
  description: |
    The Loxone MiniServer exposes its smart home controls via a **WebSocket**
    connection and mirrored **HTTP GET** endpoints. Both transports share the
    same command path syntax.

    ## Transport

    ### WebSocket (preferred)
    Connect to `ws://{host}/ws/rfc6455` and send plain-text commands as
    WebSocket text frames.  The server pushes state-update events back over
    the same connection.

    ### HTTP (alternative)
    Any command can also be sent as `GET http://{host}/{command}`.

    ## Authentication flow

    1. `GET /jdev/cfg/api` — discover API version and key-exchange algorithm
    2. `GET /jdev/cfg/getPublicKey` — fetch RSA public key
    3. Hash password → `GET /jdev/sys/gettoken/{hash}/{user}/{permission}/{clientId}/{clientName}`
    4. On subsequent connects: `GET /jdev/sys/authwithtoken/{token}/{user}`
    5. Refresh before expiry: `GET /jdev/sys/refreshtoken/{token}/{user}`
    6. Kill session: `GET /jdev/sys/killtoken/{token}/{user}`

    ## Control commands
    Control commands follow the pattern:

    ```
    jdev/sps/io/{uuid}/{command}
    jdev/sps/io/{uuid}/{command}/{value}
    ```

    where `{uuid}` is the control's UUID from the structure file
    (`GET /data/LoxAPP3.json`).

    ## State update events (WebSocket push)
    State changes are pushed as binary or text frames:
    ```
    {stateUuid}:{value}
    ```
    The `stateUuid` maps to a state variable defined in the structure file
    for each control.

    ## Structure file
    `GET /data/LoxAPP3.json` returns the full Miniserver structure: all rooms,
    categories, controls, and their state-variable UUIDs.  Parse this once to
    map control UUIDs and state UUIDs.

    ## Control types (`type` field in structure file)
    | Type string | Description |
    |-------------|-------------|
    | `InfoOnlyAnalog` | Read-only analog sensor value (most common type) |
    | `InfoOnlyDigital` | Read-only digital sensor (on/off with custom labels) |
    | `Switch` | Simple on/off switch |
    | `Pushbutton` | Momentary pushbutton |
    | `TextState` | Read-only text + icon state display |
    | `Meter` | Energy / consumption meter (actual + totals) |
    | `Dimmer` | Dimmable light output |
    | `LightController` | Light scene controller (legacy) |
    | `LightControllerV2` | Enhanced light scene controller with moods |
    | `CentralLightController` | Centralized light group controller |
    | `ColorPicker` | RGB color picker |
    | `ColorPickerV2` | Enhanced color picker (HSV + Lumitech tunable white) |
    | `Jalousie` | Blinds / shades / shutters |
    | `CentralJalousie` | Centralized blinds group controller |
    | `Gate` | Gate / barrier |
    | `GarageDoor` | Garage door |
    | `DoorLock` | Door lock |
    | `CarGate` | Car gate |
    | `WindowMonitor` | Window open/closed/tilted state monitor |
    | `IRoomController` | Room climate controller (heating, legacy) |
    | `IRoomControllerV2` | Enhanced room climate (heating + cooling + ventilation) |
    | `IRoomControllerV2021` | Latest room climate controller |
    | `ClimateController` | HVAC climate controller |
    | `ClimateControllerUS` | US-style HVAC climate controller |
    | `Ventilation` | Ventilation / air quality controller |
    | `Alarm` | Security alarm system |
    | `SmokeAlarm` | Smoke detector alarm |
    | `AalSmartAlarm` | AAL smart alarm |
    | `AalEmergency` | AAL emergency button |
    | `Intercom` | Intercom / video doorbell |
    | `NfcCodeTouch` | NFC/code access panel |
    | `TimedSwitch` | Timed switch with countdown |
    | `UpDownDigital` | Up/down digital control |
    | `TimedPulse` | Timed pulse output |
    | `Counter` | Event counter |
    | `Hourcounter` | Operating hour counter with maintenance interval |
    | `AlarmClock` | Scheduled alarm clock with wake profiles |
    | `Daytimer` | Day/week schedule timer (analog or digital) |
    | `ValueSelector` | Bounded analog value selector with step |
    | `Slider` | Analog value slider |
    | `Radio` | Multi-output selector (one-of-N or all-off) |
    | `PresenceDetector` | Presence / motion sensor with lock and timeout |
    | `Tracker` | GPS / asset tracker with entry log |
    | `EnergyManager` | Energy management |
    | `EnergyManager2` | Enhanced energy manager |
    | `EFM` | Energy flow meter (multi-node: grid, generation, storage) |
    | `LoadManager` | Power load manager with priority control |
    | `Fronius` | Fronius inverter integration |
    | `SolarPumpController` | Solar pump control |
    | `PoolController` | Pool/spa automation |
    | `Sauna` | Sauna control |
    | `AudioZone` | Audio zone (legacy) |
    | `AudioZoneV2` | Audio zone v2 (multiroom, linked to AudioServer) |
    | `CentralAudioZone` | Centralized audio zone group controller |
    | `SystemScheme` | Floor plan / system scheme visualization |
    | `Webpage` | Embedded webpage widget |
    | `ePaper` | E-paper display |
    | `CarCharger` | EV charger |
    | `CentralAlarm` | Central alarm group |
    | `CentralGate` | Central gate group |
    | `CentralLock` | Central lock group |
    | `CentralPushButton` | Central pushbutton |
    | `CentralWindow` | Central window group |

  version: "1.0.0"
  contact:
    name: Loxone

servers:
  - url: http://{host}
    description: Loxone MiniServer
    variables:
      host:
        default: "192.168.1.77"
        description: MiniServer IP or hostname

tags:
  - name: Authentication
    description: Token-based authentication flow
  - name: Structure
    description: Fetch the full Miniserver structure and config
  - name: System
    description: System information and management
  - name: Blinds (Jalousie)
    description: Blind / shade / shutter control
  - name: Lights
    description: Light controller (scenes, dimmers, RGB)
  - name: Climate
    description: Room climate and HVAC control
  - name: Switches
    description: Switches, pushbuttons, timed outputs
  - name: Access & Security
    description: Doors, gates, locks, alarms, intercoms
  - name: Energy
    description: Energy management and metering
  - name: Sensors
    description: Presence, motion, analog and digital inputs
  - name: Audio
    description: Multiroom audio zones (MiniServer side)
  - name: Users
    description: User management
  - name: Calendar
    description: Calendar entries for scheduling controls
  - name: Statistics
    description: Historical statistics
  - name: App Pairing
    description: Mobile app pairing management
  - name: Push Notifications
    description: Push notification service (PNS)
  - name: Configuration
    description: MiniServer network and system configuration

paths:

  # ─── Structure ──────────────────────────────────────────────────────────────

  /data/LoxAPP3.json:
    get:
      tags: [Structure]
      summary: Get full Miniserver structure
      description: |
        Returns the complete structure file describing all rooms, categories,
        controls, and their state variable UUIDs. Parse this once to resolve
        UUIDs before sending commands.
      responses:
        "200":
          description: Structure file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructureFile'

  /jdev/cfg/api:
    get:
      tags: [Authentication, Structure]
      summary: Get API version and key-exchange info
      responses:
        "200":
          description: API info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'

  /jdev/cfg/getPublicKey:
    get:
      tags: [Authentication]
      summary: Get RSA public key for credential encryption
      responses:
        "200":
          description: RSA public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyResponse'

  # ─── Authentication ──────────────────────────────────────────────────────────

  /jdev/sys/gettoken/{hash}/{user}/{permission}/{clientId}/{clientName}:
    get:
      tags: [Authentication]
      summary: Obtain an auth token
      description: |
        `hash` = HMAC-SHA1( SHA1(password) + ":" + user, sessionKey ).
        `permission` = 2 (web) or 4 (app).
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string }
          description: HMAC-SHA1 credential hash
        - name: user
          in: path
          required: true
          schema: { type: string }
        - name: permission
          in: path
          required: true
          schema: { type: integer, enum: [2, 4] }
          description: "2=web, 4=app"
        - name: clientId
          in: path
          required: true
          schema: { type: string }
          description: Unique client identifier (UUID)
        - name: clientName
          in: path
          required: true
          schema: { type: string }
          description: Human-readable client name
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /jdev/sys/authwithtoken/{token}/{user}:
    get:
      tags: [Authentication]
      summary: Authenticate with an existing token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: user
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Auth result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniserverResponse'

  /jdev/sys/refreshtoken/{token}/{user}:
    get:
      tags: [Authentication]
      summary: Refresh a token before expiry
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: user
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Refreshed token info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /jdev/sys/killtoken/{token}/{user}:
    get:
      tags: [Authentication]
      summary: Invalidate (kill) a token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: user
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Token killed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniserverResponse'

  /jdev/sys/keyexchange/{sessionKey}:
    get:
      tags: [Authentication]
      summary: Exchange session key (WebSocket only)
      description: Sent as the first command over the WebSocket connection after connecting.
      parameters:
        - name: sessionKey
          in: path
          required: true
          schema: { type: string }
          description: AES session key, RSA-encrypted and Base64-encoded
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniserverResponse'

  # ─── System ──────────────────────────────────────────────────────────────────

  /jdev/sys/getminiserverinfo:
    get:
      tags: [System]
      summary: Get MiniServer hardware and firmware info
      responses:
        "200":
          description: MiniServer info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniserverResponse'

  /jdev/sys/check:
    get:
      tags: [System]
      summary: Health check / keepalive ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniserverResponse'

  /jdev/sys/enc/{command}:
    get:
      tags: [System]
      summary: Send an encrypted command
      parameters:
        - name: command
          in: path
          required: true
          schema: { type: string }
          description: AES-encrypted command, Base64-encoded
      responses:
        "200":
          description: Decrypted command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniserverResponse'

  /jdev/sys/fenc/{command}:
    get:
      tags: [System]
      summary: Send a full encrypted command (AES + HMAC)
      parameters:
        - name: command
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniserverResponse'

  # ─── Blinds / Jalousie ───────────────────────────────────────────────────────

  /jdev/sps/io/{uuid}/Up:
    get:
      tags: [Blinds (Jalousie)]
      summary: Move blind up (tilt open)
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/Down:
    get:
      tags: [Blinds (Jalousie)]
      summary: Move blind down (tilt closed)
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/Stop:
    get:
      tags: [Blinds (Jalousie)]
      summary: Stop movement
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/FullUp:
    get:
      tags: [Blinds (Jalousie)]
      summary: Move fully open (100 %)
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/FullDown:
    get:
      tags: [Blinds (Jalousie)]
      summary: Move fully closed (0 %)
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/Auto:
    get:
      tags: [Blinds (Jalousie)]
      summary: Enable automatic shading mode
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/shade/{position}:
    get:
      tags: [Blinds (Jalousie)]
      summary: Set position and slat angle
      description: |
        `position` encodes both blind position and slat angle as a composite
        value. Position 0 = fully open, 1 = fully closed.
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: position
          in: path
          required: true
          schema: { type: number, minimum: 0, maximum: 1 }
          description: "Target position 0.0–1.0 (0 = open, 1 = closed)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  # ─── Lights ──────────────────────────────────────────────────────────────────

  /jdev/sps/io/{uuid}/On:
    get:
      tags: [Lights, Switches]
      summary: Turn on (lights, switches, etc.)
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/Off:
    get:
      tags: [Lights, Switches]
      summary: Turn off
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/plus:
    get:
      tags: [Lights]
      summary: Increase brightness / next mood
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/minus:
    get:
      tags: [Lights]
      summary: Decrease brightness / previous mood
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/setBrightness/{value}:
    get:
      tags: [Lights]
      summary: Set dimmer brightness (Dimmer control)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: value
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 100 }
          description: Brightness 0–100 %
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/setMoodToId/{moodId}:
    get:
      tags: [Lights]
      summary: Activate a light scene / mood (LightControllerV2)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: moodId
          in: path
          required: true
          schema: { type: integer }
          description: Mood / scene ID from the structure file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/addMood/{moodId}:
    get:
      tags: [Lights]
      summary: Add a mood to the current mix (LightControllerV2)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: moodId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/removeMood/{moodId}:
    get:
      tags: [Lights]
      summary: Remove a mood from the current mix (LightControllerV2)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: moodId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/setSaturation/{value}:
    get:
      tags: [Lights]
      summary: Set color saturation (ColorPicker)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: value
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/color/{hsv}:
    get:
      tags: [Lights]
      summary: Set RGB color (ColorPicker / ColorPickerV2)
      description: |
        HSV color encoded as `hsv(hue,saturation,value)` or Lumitech
        `lxt(colorTemp,brightness)`.

        Examples:
        - `hsv(120,100,80)` — green at 80 % brightness
        - `lxt(3000,50)` — warm white at 50 % brightness
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: hsv
          in: path
          required: true
          schema: { type: string }
          description: "HSV string: `hsv(h,s,v)` or Lumitech: `lxt(ct,bri)`"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/setFavoriteColor/{index}:
    get:
      tags: [Lights]
      summary: Recall a saved favorite color (ColorPickerV2)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/learn:
    get:
      tags: [Lights]
      summary: Trigger scene learn / save current state
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  # ─── Climate ─────────────────────────────────────────────────────────────────

  /jdev/sps/io/{uuid}/setOperatingMode/{mode}:
    get:
      tags: [Climate]
      summary: Set room operating mode (IRoomController)
      description: |
        | Value | Mode |
        |-------|------|
        | 0 | Auto (economy/comfort by schedule) |
        | 1 | Automatic heating only |
        | 2 | Automatic cooling only |
        | 3 | Manual heating |
        | 4 | Manual cooling |
        | 5 | Off |
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: mode
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 5 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/setComfortTemperature/{value}:
    get:
      tags: [Climate]
      summary: Set comfort temperature (heating setpoint)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: value
          in: path
          required: true
          schema: { type: number }
          description: Temperature in °C (or °F depending on MiniServer config)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/setComfortTemperatureCool/{value}:
    get:
      tags: [Climate]
      summary: Set comfort temperature (cooling setpoint)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: value
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/setEcoTemperatureMin/{value}:
    get:
      tags: [Climate]
      summary: Set eco minimum temperature (heating)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: value
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/setEcoTemperatureMax/{value}:
    get:
      tags: [Climate]
      summary: Set eco maximum temperature (cooling)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: value
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/override/{mode}/{duration}:
    get:
      tags: [Climate]
      summary: Override operating mode for a duration
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: mode
          in: path
          required: true
          schema: { type: integer }
        - name: duration
          in: path
          required: true
          schema: { type: integer }
          description: Duration in seconds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  # ─── Switches ────────────────────────────────────────────────────────────────

  /jdev/sps/io/{uuid}/pulse:
    get:
      tags: [Switches]
      summary: Send a momentary pulse (Pushbutton / TimedPulse)
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/pulse/{durationMs}:
    get:
      tags: [Switches]
      summary: Send a timed pulse with explicit duration
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: durationMs
          in: path
          required: true
          schema: { type: integer }
          description: Pulse duration in milliseconds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/on/{durationMs}:
    get:
      tags: [Switches]
      summary: Turn on for a timed duration (TimedSwitch)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: durationMs
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/reset:
    get:
