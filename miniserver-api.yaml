  # ─── Audio ───────────────────────────────────────────────────────────────────
  # Applies to AudioZoneV2 and CentralAudioZone controls.
  # The MiniServer side relays these commands to the connected Loxone Music Server
  # (AudioServer). State is pushed back via WebSocket: power, volume, playState,
  # clientState, serverState, bluetooth, presence, defaultVolume, etc.

  /jdev/sps/io/{uuid}/play:
    get:
      tags: [Audio]
      summary: Play / resume playback
      description: >
        Resumes playback on the audio zone. If the zone is powered off the
        Music Server is woken first.  Applies to `AudioZoneV2`.
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/pause:
    get:
      tags: [Audio]
      summary: Pause playback
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/next:
    get:
      tags: [Audio]
      summary: Skip to next track in the queue
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/prev:
    get:
      tags: [Audio]
      summary: Skip to previous track in the queue
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/on:
    get:
      tags: [Audio]
      summary: Wake audio zone (client on)
      description: >
        Powers on the audio zone client. If the Music Server is offline it is
        started first (`svpower/on`).
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/off:
    get:
      tags: [Audio]
      summary: Turn audio zone off (client off)
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/svpower/on:
    get:
      tags: [Audio]
      summary: Power on the Music Server
      description: Starts the Loxone Music Server (AudioServer) associated with this zone.
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/svpower/off:
    get:
      tags: [Audio]
      summary: Power off the Music Server
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/volume/{value}:
    get:
      tags: [Audio]
      summary: Set volume to an absolute level (0 – 100)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: value
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 100
          description: Target volume level (0 = mute, 100 = maximum)
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/volUp:
    get:
      tags: [Audio]
      summary: Volume step up
      description: Increases volume by the configured `volumeStep` value (AudioZoneV2).
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/volDown:
    get:
      tags: [Audio]
      summary: Volume step down
      description: Decreases volume by the configured `volumeStep` value (AudioZoneV2).
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/volstep/{n}:
    get:
      tags: [Audio]
      summary: Volume step by N
      description: >
        Adjusts volume by `n` steps. Positive value increases, negative decreases
        (e.g. `volstep/5` or `volstep/-5`).
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: "n"
          in: path
          required: true
          schema:
            type: integer
          description: Step amount (positive = up, negative = down)
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/shuffle/{enabled}:
    get:
      tags: [Audio]
      summary: Enable or disable shuffle
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: enabled
          in: path
          required: true
          schema:
            type: integer
            enum: [0, 1]
          description: "1 = shuffle on, 0 = shuffle off"
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/tts/{text}:
    get:
      tags: [Audio]
      summary: Play text-to-speech announcement
      description: Speaks the given text on the audio zone. URL-encode the text string.
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: text
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded text to speak (e.g. `Hello%20World`)
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/playZoneFav/{id}:
    get:
      tags: [Audio]
      summary: Play a zone favourite by slot ID
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Favourite slot index (1-based)
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/presence/on:
    get:
      tags: [Audio]
      summary: Enable presence-triggered zone wake
      description: >
        When enabled the zone wakes automatically when presence is detected
        in the assigned room (`AudioZoneV2` feature).
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/presence/off:
    get:
      tags: [Audio]
      summary: Disable presence-triggered zone wake
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/enableairplay/{enabled}:
    get:
      tags: [Audio]
      summary: Enable or disable AirPlay on this zone
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: enabled
          in: path
          required: true
          schema:
            type: integer
            enum: [0, 1]
          description: "1 = AirPlay on, 0 = AirPlay off"
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/enablespotifyconnect/{enabled}:
    get:
      tags: [Audio]
      summary: Enable or disable Spotify Connect on this zone
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: enabled
          in: path
          required: true
          schema:
            type: integer
            enum: [0, 1]
          description: "1 = Spotify Connect on, 0 = Spotify Connect off"
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/bluetooth/{enabled}:
    get:
      tags: [Audio]
      summary: Enable or disable Bluetooth on this zone
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: enabled
          in: path
          required: true
          schema:
            type: integer
            enum: [0, 1]
          description: "1 = Bluetooth on, 0 = Bluetooth off"
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/resetbluetoothpairings:
    get:
      tags: [Audio]
      summary: Reset all Bluetooth pairings on this zone
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  # Central audio zone (CentralAudioZone) ──────────────────────────────────────

  /jdev/sps/io/{uuid}/volup:
    get:
      tags: [Audio]
      summary: Master volume up (CentralAudioZone)
      description: Steps up the master volume for all zones in a `CentralAudioZone` group.
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/voldown:
    get:
      tags: [Audio]
      summary: Master volume down (CentralAudioZone)
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  # ─── Energy ──────────────────────────────────────────────────────────────────
  # Meter and EFM (Energy Flow Monitor) controls are read-only state containers.
  # Their current values (actual power/flow, daily/weekly/monthly/yearly totals)
  # are delivered as WebSocket state-update pushes after sending
  # `jdev/sps/enablebinstatusupdate`.  No write commands exist for Meter / EFM.
  #
  # EnergyManager and EnergyManager2 controls support the commands below.
  # Managed-load sub-UUIDs are listed in the control's `details.loads` array
  # in the structure file.

  /jdev/sps/io/{uuid}/trigger/{priority}:
    get:
      tags: [Energy]
      summary: Trigger load management (EnergyManager)
      description: >
        Manually triggers the load-management cycle with the given priority.
        Use `0` to release a manual trigger.  Applies to `EnergyManager` controls.
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: priority
          in: path
          required: true
          schema:
            type: integer
          description: Priority level (0 = release)
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/turnOn/{loadId}:
    get:
      tags: [Energy]
      summary: Force a managed load on (EnergyManager)
      description: >
        Forces managed load `loadId` on, overriding automatic scheduling.
        Applies to `EnergyManager` controls.
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: loadId
          in: path
          required: true
          schema:
            type: integer
          description: Load index
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/turnOff/{loadId}:
    get:
      tags: [Energy]
      summary: Force a managed load off (EnergyManager)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: loadId
          in: path
          required: true
          schema:
            type: integer
          description: Load index
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/{loadUUID}/activate:
    get:
      tags: [Energy]
      summary: Activate a managed load (EnergyManager2)
      description: >
        Forces the load identified by `loadUUID` into the active (on) state,
        overriding automatic scheduling.  Applies to `EnergyManager2` controls.
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: loadUUID
          in: path
          required: true
          schema:
            type: string
          description: UUID of the managed load (from `details.loads` in the structure file)
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/{loadUUID}/deactivate:
    get:
      tags: [Energy]
      summary: Deactivate a managed load (EnergyManager2)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: loadUUID
          in: path
          required: true
          schema:
            type: string
          description: UUID of the managed load
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/{loadUUID}/automatic:
    get:
      tags: [Energy]
      summary: Return a managed load to automatic scheduling (EnergyManager2)
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: loadUUID
          in: path
          required: true
          schema:
            type: string
          description: UUID of the managed load
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/setMinSoc/{percent}:
    get:
      tags: [Energy]
      summary: Set minimum battery state-of-charge (EnergyManager2)
      description: >
        Sets the minimum allowed state-of-charge for the battery storage node.
        Applies to `EnergyManager2` controls.
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: percent
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 100
          description: Minimum SoC in percent
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  # ─── Sensors ─────────────────────────────────────────────────────────────────
  # InfoOnlyAnalog and InfoOnlyDigital controls are purely read-only.
  # Their current state (value / active flag) is delivered via WebSocket
  # state-update pushes after sending `jdev/sps/enablebinstatusupdate`.
  # No write commands exist for those control types.
  #
  # PresenceDetector supports the commands below for activating / overriding
  # the detection state.

  /jdev/sps/io/{uuid}/presence/{active}:
    get:
      tags: [Sensors]
      summary: Set PresenceDetector active state
      description: >
        Manually sets the presence-detection state.
        `1` marks presence as active; `0` marks it as inactive.
        Applies to `PresenceDetector` controls.
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: active
          in: path
          required: true
          schema:
            type: integer
            enum: [0, 1]
          description: "1 = presence active, 0 = presence inactive"
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

  /jdev/sps/io/{uuid}/deactivate/{seconds}:
    get:
      tags: [Sensors]
      summary: Disable PresenceDetector for N seconds
      description: >
        Temporarily disables the presence detector for `seconds` seconds
        (e.g. while cleaning to avoid unwanted triggering).
        Pass `0` to cancel an active disable override.
        Applies to `PresenceDetector` controls.
      parameters:
        - $ref: '#/components/parameters/uuid'
        - name: seconds
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: Disable duration in seconds (0 = cancel override)
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoResponse'

components:

  parameters:
    uuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
        example: "12ab34cd-ef56-7890-abcd-ef1234567890"
      description: Control UUID from the structure file (`/data/LoxAPP3.json`)

  schemas:

    MiniserverResponse:
      type: object
      description: Standard MiniServer JSON response envelope
      properties:
        LL:
          type: object
          properties:
            control:
              type: string
              description: The command that was executed
            value:
              description: Response payload (string, number, or nested object)
            Code:
              type: string
              description: HTTP-like status code ("200" = success)

    IoResponse:
      type: object
      description: Response from a control I/O command
      properties:
        LL:
          type: object
          properties:
            control:
              type: string
              example: "jdev/sps/io/12ab34cd-ef56-7890-abcd-ef1234567890/On"
            value:
              type: string
              description: Acknowledged value (often "1" or "0")
            Code:
              type: string
              example: "200"

    ApiInfo:
      type: object
      properties:
        LL:
          type: object
          properties:
            control:
              type: string
            value:
              type: object
              properties:
                version:
                  type: string
                  example: "12.3.4.5"
                snr:
                  type: string
                  description: MiniServer serial number
                name:
                  type: string
                  description: MiniServer name
                httpsStatus:
                  type: integer
                  description: "HTTPS status: 0=off, 1=no cert, 2=self-signed, 3=valid cert"
            Code:
              type: string

    PublicKeyResponse:
      type: object
      properties:
        LL:
          type: object
          properties:
            control:
              type: string
            value:
              type: string
              description: PEM-encoded RSA public key
            Code:
              type: string

    TokenResponse:
      type: object
      properties:
        LL:
          type: object
          properties:
            control:
              type: string
            value:
              type: object
              properties:
                token:
                  type: string
                  description: Auth token string
                key:
                  type: string
                  description: AES session key
                validUntil:
                  type: integer
                  description: Token expiry (Unix timestamp)
                tokenRights:
                  type: integer
                  description: Bitmask of granted permissions
                unsecurePassword:
                  type: boolean
            Code:
              type: string

    StructureFile:
      type: object
      description: Full MiniServer structure (LoxAPP3.json)
      properties:
        lastModified:
          type: string
          description: "Timestamp of last config change, format: `YYYY-MM-DD HH:MM:SS`"
          example: "2024-03-15 10:22:47"
        msInfo:
          $ref: '#/components/schemas/MsInfo'
        globalStates:
          $ref: '#/components/schemas/GlobalStates'
        operatingModes:
          type: object
          additionalProperties:
            type: string
          description: |
            Map of operating mode ID → display name.
            Positive IDs 0–11 are system-defined (weekdays, holiday, heat/cool period).
            Negative IDs are user-defined custom modes (e.g. -1=Alarm, -5=Party, -6=Away).
          example:
            "0": "Holiday"
            "3": "Monday"
            "10": "Heat period"
            "-1": "Alarm"
            "-6": "Away"
        modes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OperatingMode'
          description: Same operating modes as `operatingModes`, keyed by mode UUID instead of numeric ID
        rooms:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Room'
          description: Map of roomUuid → Room
        cats:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Category'
          description: Map of catUuid → Category
        controls:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Control'
          description: Map of controlUuid → Control
        weatherServer:
          $ref: '#/components/schemas/WeatherServer'
        times:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TimeEntry'
          description: Map of time zone ID → time zone definition
        mailer:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MailerEntry'
          description: Map of UUID → email notification configuration
        mediaServer:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Control'
          description: Map of UUID → media server control (AudioZoneV2 preset source)
        autopilot:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AutopilotEntry'
          description: Map of UUID → autopilot control (tracks rule changes)
        messageCenter:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MessageCenterEntry'
          description: Map of UUID → message center control (system notifications)
        partnerInfo:
          $ref: '#/components/schemas/PartnerInfo'

    MsInfo:
      type: object
      description: MiniServer identity, location, and regional settings
      properties:
        serialNr:
          type: string
          description: MiniServer serial number
        msName:
          type: string
          description: MiniServer display name
        projectName:
          type: string
          description: Project / installation name
        localUrl:
          type: string
          description: LAN IP address of the MiniServer
        remoteUrl:
          type: string
          description: Cloud / remote access hostname
        hostname:
          type: string
          description: Short hostname (same as or derived from localUrl)
        tempUnit:
          type: integer
          enum: [0, 1]
          description: "0 = Celsius, 1 = Fahrenheit"
        currency:
          type: string
          description: Local currency symbol (e.g. "€", "$")
        squareMeasure:
          type: string
          description: Area unit (e.g. "m²", "ft²")
        location:
          type: string
          description: Free-text location / address string
        latitude:
          type: number
          description: Geographic latitude in decimal degrees
        longitude:
          type: number
          description: Geographic longitude in decimal degrees
        altitude:
          type: integer
          description: Altitude above sea level in metres (used for sunrise/sunset calc)
        languageCode:
          type: string
          description: ISO 639-2 language code (e.g. "DEU", "ENG")
        heatPeriodStart:
          type: string
          description: "Start of heating period, format MM-DD (e.g. \"09-20\")"
        heatPeriodEnd:
          type: string
          description: "End of heating period, format MM-DD (e.g. \"04-30\")"
        coolPeriodStart:
          type: string
          description: "Start of cooling period, format MM-DD (e.g. \"05-01\")"
        coolPeriodEnd:
          type: string
          description: "End of cooling period, format MM-DD (e.g. \"09-19\")"
        catTitle:
          type: string
          description: Custom label for the category concept (default "Category")
        roomTitle:
          type: string
          description: Custom label for the room concept (default "Room")
        miniserverType:
          type: integer
          description: "MiniServer hardware generation: 0=Gen1, 1=Go, 2=Gen2, 3=Gen2 Go"
        deviceMonitor:
          type: string
          description: UUID of the device monitor control (if configured)
        currentUser:
          $ref: '#/components/schemas/CurrentUser'

    Room:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        image:
          type: string
          description: Icon path relative to the MiniServer icon set (e.g. "IconsFilled/location-pin.svg")
        defaultRating:
          type: integer
          description: Sort order / priority (higher = more prominent)
        isFavorite:
          type: boolean
        default:
          type: boolean
          description: True for the built-in "Unassigned" catch-all room
        type:
          type: integer
        color:
          type: string
          description: "Accent color as hex string (e.g. \"#8DFF70\")"

    Category:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        image:
          type: string
          description: Icon path relative to the MiniServer icon set (e.g. "IconsFilled/binders.svg")
        defaultRating:
          type: integer
          description: Sort order / priority (higher = more prominent)
        isFavorite:
          type: boolean
        default:
          type: boolean
          description: True for the built-in "Unassigned" catch-all category
        type:
          type: string
          description: "Category function type: \"undefined\", \"lights\", \"shading\", \"climate\", \"media\", \"entrance\", \"device\", \"home\""
        color:
          type: string
          description: "Accent color as hex string (e.g. \"#8DFF70\")"

    Control:
      type: object
      description: A single smart home control
      properties:
        uuid:
          type: string
        name:
          type: string
        type:
          type: string
          description: Control type string (e.g. "Jalousie", "LightControllerV2", "InfoOnlyAnalog")
        uuidAction:
          type: string
          description: UUID to use for sending commands (may differ from the object key UUID)
        room:
          type: string
          description: Room UUID
        cat:
          type: string
          description: Category UUID
        defaultRating:
          type: integer
          description: Sort priority (higher = more prominent in UI)
        isFavorite:
          type: boolean
        isSecured:
          type: boolean
          description: Whether commands require a PIN/password confirmation
        restrictions:
          type: integer
          description: Bitmask of user-right restrictions on this control
        details:
          type: object
          additionalProperties: true
          description: |
            Type-specific static configuration. Common fields by type:

            **InfoOnlyAnalog**: `format` (printf-style, e.g. "%.1f °C")
            **InfoOnlyDigital**: `text.on`, `text.off`, `color.on`, `color.off`
            **Meter**: `type` ("unidirectional"/"bidirectional"), `actualFormat`, `totalFormat`, `powerName`, `displayType`
            **Dimmer**: `jLockable`
            **LightControllerV2**: `jLockable`, `masterValue` (subcontrol UUID), `masterColor` (subcontrol UUID), `controlHistory`
            **ColorPickerV2**: `pickerType` ("Rgb"/"Lumitech"/"RGB+Lumitech"), `TWMin`, `TWMax`
            **Jalousie**: `jLockable`, `isAutomatic`, `animation`, `type`
            **IRoomControllerV2**: `timerModes`, `format`, `connectedInputs`, `possibleCapabilities`, `singleComfortTemperature`, `sources`, `linkedAcControls`
            **Ventilation**: `modes`, `timerProfiles`, `type`, `hasPresence`, `hasIndoorHumidity`, `hasAirQuality`, `hasHeatExchanger`
            **AlarmClock**: `hasNightLight`, `wakeAlarmSounds`, `snoozeDurationConnected`
            **Daytimer**: `analog` (true = analog output, false = digital), `format`
            **ValueSelector**: `min`, `max`, `step`, `format`, `increaseOnly`
            **Slider**: `min`, `max`, `step`, `format`
            **Radio**: `allOff` (label for "all off" state), `outputs` (map of output index → name)
            **AudioZoneV2**: `server` (media server UUID), `playerid`, `clientType`, `speakerConfig`, `volumeModes`
            **EFM**: `actualFormat`, `totalFormat`, `storageFormat`, `nodes`, `rest`, `restMeter`, `restName`
            **LoadManager**: `loads`, `mode`
            **WindowMonitor**: `windows`
            **SystemScheme**: `imagePath`, `imageVersion`, `schemeSize`, `controlReferences`
            **Intercom**: `deviceType`, `videoInfo`, `audioInfo`, `outputs`, `lastBellEventImages`
        states:
          type: object
          additionalProperties:
            type: string
          description: |
            Map of state name → state UUID.
            Subscribe to state UUIDs over WebSocket to receive real-time value updates.
            State UUIDs pushed over the wire use the raw UUID (no "U:" prefix).

            **InfoOnlyAnalog**: `value`
            **InfoOnlyDigital**: `active`
            **TextState**: `textAndIcon`, `iconAndColor`
            **Meter**: `jLocked`, `actual`, `total`, `totalDay`, `totalWeek`, `totalMonth`, `totalYear`
            **Switch**: `jLocked`, `active`, `lockedOn`
            **Pushbutton**: `jLocked`, `active`
            **Dimmer**: `jLocked`, `position`, `min`, `max`, `step`
            **ColorPickerV2**: `color`, `sequence`, `sequenceColorIdx`
            **LightControllerV2**: `jLocked`, `activeMoods`, `moodList`, `activeMoodsNum`, `favoriteMoods`, `additionalMoods`, `circuitNames`, `daylightConfig`, `presence`
            **Jalousie**: `jLocked`, `up`, `down`, `position`, `shadePosition`, `safetyActive`, `autoAllowed`, `autoActive`, `locked`, `infoText`, `autoInfoText`, `autoState`, `deviceState`, `targetPosition`, `targetPositionLamelle`, `adjustingEndPos`
            **Gate**: `jLocked`, `position`, `active`, `preventOpen`, `preventClose`
            **IRoomControllerV2**: `jLocked`, `tempActual`, `tempTarget`, `comfortTemperature`, `comfortTemperatureCool`, `comfortTolerance`, `absentMinOffset`, `absentMaxOffset`, `frostProtectTemperature`, `heatProtectTemperature`, `shadingCoolTemp`, `shadingHeatTemp`, `co2`, `humidityActual`, `actualOutdoorTemp`, `currentMode`, `shadingOut`, `active`, `activeMode`, `comfortTemperatureOffset`, `overrideEntries`, `prepareState`, `useOutdoor`, `operatingMode`, `overrideReason`, `excessEnergyTempOffset`, `averageOutdoorTemp`, `temperatureBoundaryInfo`, `capabilities`, `fan`, `ventMode`, `co2Target`, `airDeviceState`, `openWindow`
            **ClimateControllerUS**: `jLocked`, `mode`, `controls`, `currentStatus`, `serviceMode`, `fanTimerUntil`, `modeTimerUntil`, `emergencyTimerUntil`, `demandCool`, `demandHeat`, `stage`, `minimumTempCooling`, `maximumTempHeating`, `actualOutdoorTemp`, `fan`, `emergencyOverride`, `humidity`, `threshold`, `excessEnergy`, `outdoorTempInfo`, `nextMaintenance`, `outdoorTempMode`
            **Ventilation**: `jLocked`, `ventReason`, `speed`, `absenceMax`, `absenceMin`, `presenceMax`, `presenceMin`, `humidityIndoor`, `humidityMax`, `airQualityMax`, `airQualityIndoor`, `stoppedBy`, `controlInfo`, `activeTimerProfile`, `presence`, `overwriteUntil`, `mode`, `temperatureIndoor`, `temperatureOutdoor`, `temperatureTarget`, `temperatureSupport`, `frostTemp`, `activeMode`, `heatExchanger`
            **Alarm**: `jLocked`, `armed`, `nextLevel`, `nextLevelDelay`, `nextLevelDelayTotal`, `level`, `startTime`, `armedAt`, `nextLevelAt`, `armedDelay`, `armedDelayTotal`, `sensors`, `disabledMove`, `events`
            **Intercom**: `jLocked`, `bell`, `lastBellEvents`, `lastBellTimestamp`
            **Daytimer**: `jLocked`, `mode`, `override`, `value`, `needsActivation`, `modeList`, `entriesAndDefaultValue`, `resetActive`
            **AlarmClock**: `jLocked`, `isEnabled`, `isAlarmActive`, `confirmationNeeded`, `entryList`, `currentEntry`, `nextEntry`, `nextEntryMode`, `ringingTime`, `ringDuration`, `prepareDuration`, `snoozeTime`, `snoozeDuration`, `nextEntryTime`, `deviceState`, `deviceSettings`, `wakeAlarmSoundSettings`
            **ValueSelector**: `jLocked`, `min`, `max`, `step`, `value`
            **Slider**: `value`, `error`
            **Radio**: `jLocked`, `activeOutput`
            **PresenceDetector**: `jLocked`, `active`, `locked`, `events`, `time`, `activeSince`, `infoText`, `lockedUntil`, `activeUntil`
            **Tracker**: `entries`
            **Hourcounter**: `total`, `remaining`, `lastActivation`, `overdue`, `maintenanceInterval`, `stateUnit`, `totalTime`, `active`, `overdueSince`
            **AudioZoneV2**: `jLocked`, `power`, `volume`, `defaultVolume`, `alarmVolume`, `bellVolume`, `buzzerVolume`, `ttsVolume`, `maxVolume`, `volumeStep`, `isLocked`, `bluetooth`, `serverState`, `clientState`, `playState`, `presence`
            **CentralLightController / CentralJalousie / CentralAudioZone**: `jLocked`, `events`
            **CentralJalousie** (extra): `safetyActive`
            **WindowMonitor**: `numOpen`, `numClosed`, `numTilted`, `numOffline`, `numLocked`, `numUnlocked`, `windowStates`
            **EFM**: `jLocked`, `Ppwr`, `Gpwr`, `Spwr`, `Pre`, `Pri`, `CO2`, `selfConsumption`, `actual0`, `actual1`
            **LoadManager**: `jLocked`, `currentPower`, `peakOverloadPower`, `maxPower`, `maxTp`, `maxPowerExceeded`, `availablePower`, `lockedLoads`, `statusLoads`
        subControls:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Control'
          description: |
            Child controls (e.g. individual circuit dimmers or color pickers within a LightControllerV2).
            Keys are composite UUIDs in the form `{parentUuid}/{slotName}`.

    GlobalStates:
      type: object
      description: |
        System-wide state UUIDs. Each value is a state UUID that can be subscribed
        to over WebSocket for real-time updates.
      properties:
        operatingMode:
          type: string
          description: Current global operating mode (maps to an ID in `operatingModes`)
        sunrise:
          type: string
          description: Today's sunrise time as Unix timestamp (seconds since midnight)
        sunset:
          type: string
          description: Today's sunset time as Unix timestamp (seconds since midnight)
        pastTasks:
          type: string
          description: Recently executed autopilot / calendar tasks
        plannedTasks:
          type: string
          description: Upcoming scheduled autopilot / calendar tasks
        notifications:
          type: string
          description: Pending system notifications count
        modifications:
          type: string
          description: Config modification counter (increments on each change)
        miniserverTime:
          type: string
          description: Current MiniServer Unix timestamp (wall clock)
        favColorSequences:
          type: string
          description: Saved favorite color sequences for ColorPickerV2
        favColors:
          type: string
          description: Saved favorite single colors for ColorPickerV2
        liveSearch:
          type: string
          description: Live search state
        userSettings:
          type: string
          description: Per-user UI settings blob
        userSettingsTs:
          type: string
          description: Timestamp of last user settings change
        cloudservice:
          type: string
          description: Cloud service connectivity status
        trustVersion:
          type: string
          description: Trust/certificate version counter
        propsVersion:
          type: string
          description: System properties version counter
        hasInternet:
          type: string
          description: Internet connectivity flag (1 = online, 0 = offline)

    CurrentUser:
      type: object
      description: |
        Identity of the authenticated user. Values are server-side template
        placeholders resolved at login time (not literal strings).
      properties:
        name:
          type: string
          description: "Username (template: $$username)"
        uuid:
          type: string
          description: "User UUID (template: $$useruuid)"
        isAdmin:
          type: string
          description: "\"1\" if the user has admin rights (template: $$isAdmin)"
        changePassword:
          type: string
          description: "\"1\" if the user must change their password (template: $$changePwd)"
        userRights:
          type: string
          description: "Bitmask of granted user rights (template: $$userRights)"

    OperatingMode:
      type: object
      description: An operating mode entry (from the `modes` map, keyed by UUID)
      properties:
        id:
          type: integer
          description: |
            Numeric mode ID (same key used in `operatingModes`).
            0–11 are system-defined. Positive IDs:
            0=Holiday, 1=Vacation, 2=Day off, 3=Monday … 9=Sunday,
            10=Heat period, 11=Cool period.
            Negative IDs are user-defined custom modes.
        name:
          type: string
          description: Display name of the mode

    WeatherServer:
      type: object
      description: Weather integration metadata and state UUIDs
      properties:
        states:
          type: object
          description: State UUIDs for weather data
          properties:
            actual:
              type: string
              description: UUID of the current weather state
            forecast:
              type: string
              description: UUID of the weather forecast state
        format:
          type: object
          description: Printf-style display format strings for weather values
          properties:
            relativeHumidity:
              type: string
              example: "%.0f%%"
            temperature:
              type: string
              example: "%.1f°"
            windSpeed:
              type: string
              example: "%.0fkm/h"
            precipitation:
              type: string
              example: "%.1fl/m²/h"
            barometricPressure:
              type: string
              example: "%.0fhPa"
        weatherTypeTexts:
          type: object
          additionalProperties:
            type: string
          description: |
            Map of weather type ID → display name.
            IDs correspond to standard weather condition codes
            (e.g. 1=clear, 2=fair, 3=cloudy, 4=overcast, 5=covered, …)
        weatherFieldTypes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/WeatherFieldType'
          description: Map of field ID → weather field type definition

    WeatherFieldType:
      type: object
      description: Definition of a single weather data field
      properties:
        id:
          type: integer
          description: |
            Field ID. Known IDs:
            1=Temperature, 2=Dew point, 3=Relative humidity, 4=Wind speed,
            5=Wind direction, 6=Wind gust, 7=Wind gust direction, 8=UV index,
            9=Precipitation, 10=Precipitation probability, 11=Barometric pressure,
            26=Perceived temperature
        analog:
          type: boolean
          description: True for numeric (analog) fields, false for discrete/enum fields
        unit:
          type: string
          description: Physical unit string (e.g. "°C", "km/h", "hPa")
        format:
          type: string
          description: Printf-style display format (e.g. "%.1f", "%.0f%%")

    TimeEntry:
      type: object
      description: Time zone definition entry
      properties:
        id:
          type: integer
          description: Numeric time zone ID
        name:
          type: string
          description: IANA time zone name (e.g. "Europe/Rome")
        analog:
          type: boolean
          description: Whether this entry represents an analog (offset-based) zone

    MailerEntry:
      type: object
      description: Email notification configuration entry
      properties:
        id:
          type: string
          description: Mailer UUID
        name:
          type: string
          description: Display name of this mailer configuration
        eMailAddress:
          type: string
          description: Target email address

    AutopilotEntry:
      type: object
      description: Autopilot rule engine control
      properties:
        name:
          type: string
        uuidAction:
          type: string
        states:
          type: object
          properties:
            changed:
              type: string
              description: State UUID updated when any autopilot rule fires
            history:
              type: string
              description: State UUID holding the recent rule execution history

    MessageCenterEntry:
      type: object
      description: Message center / system notification control
      properties:
        name:
          type: string
        uuidAction:
          type: string
        states:
          type: object
          properties:
            changed:
              type: string
              description: State UUID updated whenever a new system message arrives

    PartnerInfo:
      type: object
      description: Installer / integrator contact information embedded in the structure file
      properties:
        name:
          type: string
          description: Installer or company name
        details:
          type: object
          description: Additional contact details (phone, email, website, etc.)
