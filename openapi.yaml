                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/input/{playerId}/{inputId}:
    get:
      tags: [Config – Info]
      summary: Select line-in input for a zone
      description: |
        **Note:** the official App selects a line-in for playback via
        `audio/{zoneId}/linein/{inputId}` (see *Zone Content*). It uses
        `audio/cfg/input/…` only for input **configuration** — see the
        `rename` / `type` sub-routes below.
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
        - name: inputId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Input selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/input/{inputId}/rename/{name}:
    get:
      tags: [Config – Info]
      summary: Rename a line-in input
      parameters:
        - name: inputId
          in: path
          required: true
          schema:
            type: string
          description: Input identifier (from `getinputs`)
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded new display name
      responses:
        "200":
          description: Input renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/input/{inputId}/type/{iconType}:
    get:
      tags: [Config – Info]
      summary: Set the icon type of a line-in input
      parameters:
        - name: inputId
          in: path
          required: true
          schema:
            type: string
          description: Input identifier (from `getinputs`)
        - name: iconType
          in: path
          required: true
          schema:
            type: integer
          description: Icon / device type index
      responses:
        "200":
          description: Input type updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/upload/audioupload/add/{filename}:
    get:
      tags: [Config – Info]
      summary: Register an uploaded audio file
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  # ─── MiniServer › Pairing & Auth ────────────────────────────────────────────
  # Sent by the MiniServer immediately after WebSocket connect.
  # The App never sends these.

  /secure/info/pairing:
    get:
      tags: ["MiniServer › Pairing & Auth"]
      summary: Query pairing status
      description: |
        Returns pairing state and the MiniServer serial that this AudioServer
        is paired to. Error code `-81` means "not paired to any master".
      responses:
        "200":
          description: Pairing info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurePairingResponse'

  /secure/hello/{publicKey}:
    get:
      tags: ["MiniServer › Pairing & Auth"]
      summary: Key-exchange bootstrap
      description: |
        The MiniServer sends its RSA public key; the AudioServer echoes it
        back to confirm the channel.
      parameters:
        - name: publicKey
          in: path
          required: true
          schema: { type: string }
          description: Base64-encoded RSA public key from the MiniServer
      responses:
        "200":
          description: Key echoed back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecureHelloResponse'

  /secure/authenticate:
    get:
      tags: ["MiniServer › Pairing & Auth"]
      summary: Acknowledge authentication
      description: Returns a fixed `"authentication successful"` confirmation.
      responses:
        "200":
          description: Auth acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /secure/init:
    get:
      tags: ["MiniServer › Pairing & Auth"]
      summary: Session initialisation
      description: |
        Returns a legacy JWT used by older MiniServer firmware for session
        bookkeeping. The token is fixed and not cryptographically verified.
      responses:
        "200":
          description: Session JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecureInitResponse'

  # ─── MiniServer › Config Sync ────────────────────────────────────────────────
  # Sent by the MiniServer to push or pull configuration.
  # The App never sends these.

  /audio/cfg/ready:
    get:
      tags: ["MiniServer › Config Sync"]
      summary: Signal readiness
      description: |
        Sent by the MiniServer once it has finished its startup sequence.
        The AudioServer responds with a session timestamp so the MiniServer
        can detect restarts.
      responses:
        "200":
          description: Ready acknowledged with session timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  command:
                    type: string
                    example: "audio/cfg/ready"
                  ready_result:
                    type: object
                    properties:
                      session:
                        type: integer
                        description: Unix ms timestamp of the current AudioServer session

  /audio/cfg/getconfig:
    get:
      tags: ["MiniServer › Config Sync"]
      summary: Fetch zone configuration checksum
      description: |
        The MiniServer calls this to check whether its cached configuration is
        still valid.  Returns the CRC-32 of the current config and any active
        extensions.
      responses:
        "200":
          description: Config checksum
          content:
            application/json:
              schema:
                type: object
                properties:
                  command:
                    type: string
                  getconfig_result:
                    type: object
                    properties:
                      crc32:
                        type: string
                        nullable: true
                        description: CRC-32 hex string of the current zone config
                      extensions:
                        type: array
                        items: { type: string }

  /audio/cfg/setconfig:
    get:
      tags: ["MiniServer › Config Sync"]
      summary: Push zone configuration from MiniServer
      description: |
        The MiniServer sends zone names, UUIDs, and settings to the
        AudioServer so it can map Loxone zone UUIDs to internal player IDs.
      responses:
        "200":
          description: Config accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/setconfigtimestamp:
    get:
      tags: ["MiniServer › Config Sync"]
      summary: Sync configuration version timestamp
      description: |
        Updates the AudioServer's record of when the MiniServer config was
        last modified.  Used to detect stale caches.
      responses:
        "200":
          description: Timestamp accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/miniservertime:
    get:
      tags: ["MiniServer › Config Sync"]
      summary: Sync MiniServer wall-clock time
      description: |
        The MiniServer periodically sends its current Unix timestamp so the
        AudioServer can correct relative time values (e.g. schedule offsets).
      responses:
        "200":
          description: Time accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/volumes:
    get:
      tags: ["MiniServer › Config Sync"]
      summary: Bulk-set initial zone volumes
      description: |
        Sent by the MiniServer on startup to restore the last-known volume
        for every zone at once.
      responses:
        "200":
          description: Volumes applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/playername:
    get:
      tags: ["MiniServer › Config Sync"]
      summary: Set zone display name
      description: Sent by the MiniServer to rename a zone on the AudioServer.
      responses:
        "200":
          description: Name applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/identify:
    get:
      tags: ["MiniServer › Config Sync"]
      summary: MiniServer identification
      description: |
        The MiniServer sends its serial number and firmware version so the
        AudioServer can tag log entries and heartbeats.
      responses:
        "200":
          description: Identification accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/defaultvolume/{zoneId}/{volume}:
