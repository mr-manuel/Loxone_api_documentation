  /audio/cfg/playlist/update:
    get:
      tags: [Config – Playlists]
      summary: Update playlist items (add / remove / reorder)
      description: |
        Playlist editing is a **session protocol**. All operations share the form
        `audio/cfg/playlist/update/{service}/{user}/{playlistId}/{operation}`:

        | Operation | Effect |
        |-----------|--------|
        | `start` | Open an edit session (locks the playlist) |
        | `additem:{itemId}` | Add a single item (audio path) |
        | `addbrowsable:{contentId}` | Add all items of a browsable container |
        | `moveById/{itemId}/before/{targetItemId}` | Reorder — move item before target (`end` = move to end) |
        | `removeById/{itemId}` | Remove an item |
        | `finish` | Close the session and save changes |
        | `finishnochanges` | Close the session and discard changes |

        A conflicting edit by another client ends the session with cause
        `conflict` (see `playlistchanged_event`).
      responses:
        "200":
          description: Playlist updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

