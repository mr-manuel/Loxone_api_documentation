      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/dgroup/update:
    get:
      tags: [Config – Info]
      summary: Update dynamic player groups
      description: |
        Full form used by the App: `audio/cfg/dgroup/update/{groupId}/{playerIds}`
        with `{playerIds}` as comma-separated list (e.g.
        `audio/cfg/dgroup/update/abc123/1,2,3`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/unsyncmulti/{playerIds}:
    get:
      tags: [Config – Info]
      summary: Unsync multiple players
      parameters:
        - name: playerIds
          in: path
          required: true
