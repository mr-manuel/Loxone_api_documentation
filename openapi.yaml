# ─── Components ───────────────────────────────────────────────────────────────

components:

  parameters:
    zoneId:
      name: zoneId
      in: path
      required: true
      schema:
        type: integer
        example: 1
      description: Numeric zone / player ID

  schemas:

    CommandResponse:
      type: object
      description: Generic command response wrapper
      properties:
        command:
          type: string
          description: The original command path
          example: "audio/1/play"
        error:
          type: string
          description: Error message (only present on failure)
      additionalProperties: true

    ZoneState:
      type: object
      description: Full state snapshot of a zone / player
      required: [playerid, name, mode, volume]
      properties:
        playerid:
          type: integer
          description: Zone identifier
          example: 1
        name:
          type: string
          description: Zone display name
          example: "Living Room"
        mode:
          type: string
          enum: [play, pause, stop]
          description: Current playback state
        power:
          type: string
          enum: [on, off]
          description: Physical power state
        clientState:
          type: string
          enum: [on, off]
          description: Client (UI) power state
        powerState:
          type: string
          enum: [on, off]
          description: Managed amplifier power state
          nullable: true
        volume:
          type: integer
          minimum: 0
          maximum: 100
          description: Current volume (0–100)
        title:
          type: string
          description: Current track title
        artist:
          type: string
          description: Track artist
        album:
          type: string
          description: Track album
        station:
          type: string
          description: Radio station metadata (name or description)
        coverurl:
          type: string
          description: URL to album / cover art
        audiopath:
          type: string
          description: Internal encoded audio URI of current track
        audiotype:
          type: integer
          description: |
            Audio source type:
            0=File, 1=Radio, 2=Playlist, 3=LineIn, 4=AirPlay, 5=Spotify, 6=Bluetooth, 7=SoundSuit
          enum: [0, 1, 2, 3, 4, 5, 6, 7]
        type:
          type: integer
          description: File/container type enum
        time:
          type: number
          description: Current playback position in seconds
        duration:
          type: number
          description: Total track duration in seconds
        qindex:
          type: integer
          description: Current zero-based queue position
        plshuffle:
          type: integer
          enum: [0, 1]
          description: "Shuffle: 0=off, 1=on"
        plrepeat:
          type: integer
          enum: [0, 1, 3]
          description: "Repeat mode: 0=off, 1=queue, 3=track"
        queueAuthority:
          type: string
          nullable: true
          description: "Queue owner identifier (e.g. local, spotify)"
        sourceName:
          type: string
          description: Human-readable source name
        icontype:
          type: integer
          nullable: true
          description: |
            Line-in icon type:
            0=LineIn, 1=CdPlayer, 2=Computer, 3=iMac, 4=iPod, 5=Mobile, 6=Radio, 7=Screen, 8=TurnTable
        qid:
          type: string
          nullable: true
          description: Queue identifier
        parent:
          description: Currently-playing parent container (album / playlist / etc.)
          nullable: true
          oneOf:
            - type: object
              properties:
                audiopath:
                  type: string
                coverurl:
                  type: string
                id:
                  type: string
                items:
                  type: integer
                  description: Total items in parent container
                name:
                  type: string
                type:
                  type: integer
            - type: "null"

    ZoneStatusResponse:
      type: object
      properties:
        command:
          type: string
          example: "audio/1/status"
        status_result:
          type: array
          items:
            $ref: '#/components/schemas/ZoneState'

    QueueItem:
      type: object
      description: A single item in the playback queue
      properties:
        qindex:
          type: integer
          description: Zero-based position in the queue
        unique_id:
          type: string
          description: Unique queue item identifier
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        station:
          type: string
        coverurl:
          type: string
        audiopath:
          type: string
          description: Encoded audio URI
        audiotype:
          type: integer
          enum: [0, 1, 2, 3, 4, 5, 6, 7]
        duration:
          type: number
          description: Track duration in seconds
        user:
          type: string
          description: Source account (e.g. username or "nouser")
        originalIndex:
          type: integer
          nullable: true
          description: Original position before shuffling

    QueueResult:
      type: object
      properties:
        id:
          type: string
          description: Queue identifier
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'
        shuffle:
          type: boolean
        start:
          type: integer
          description: Requested start index
        totalitems:
          type: integer
          description: Total number of items in the queue

    QueueResponse:
      type: object
      properties:
        command:
          type: string
          example: "audio/1/getqueue/0/50"
        getqueue_result:
          type: array
          items:
            $ref: '#/components/schemas/QueueResult'

    ServicePlayResponse:
      type: object
      properties:
        command:
          type: string
        serviceplay_result:
          type: array
          items:
            type: object
            properties:
              zoneId:
                type: integer
              uri:
                type: string

    RoomFavPlayResponse:
      type: object
      properties:
        command:
          type: string
        roomfav_result:
          type: array
          items:
            type: object
            properties:
              playerid:
                type: integer
              playing_slot:
                type: integer

    ScanStatusResponse:
      type: object
      properties:
        command:
          type: string
        scanstatus_result:
          type: object
          properties:
            status:
              type: integer
              enum: [0, 1, 2]
              description: "0=idle, 1=scanning, 2=complete"
            folders:
              type: integer
              nullable: true
            files:
              type: integer
              nullable: true

    # ── WebSocket event payloads ──────────────────────────────────────────────

    WsAudioEvent:
      type: object
      description: WebSocket event — zone state changed
      properties:
        audio_event:
          type: array
          items:
            $ref: '#/components/schemas/ZoneState'

    WsQueueEvent:
      type: object
      description: WebSocket event — queue contents changed
      properties:
        audio_queue_event:
          type: array
          items:
            type: object
            properties:
              playerid:
                type: integer
              queuesize:
                type: integer
              restrictions:
                type: integer

    WsRoomFavChangedEvent:
      type: object
      description: WebSocket event — room favorites changed
      properties:
        roomfavchanged_event:
          type: array
          items:
            type: object
            properties:
              playerid:
                type: integer
              count:
                type: integer

    WsRecentlyPlayedEvent:
      type: object
      description: WebSocket event — recently played changed
      properties:
        recentlyplayedchanged_event:
          type: array
          items:
            type: object
            properties:
              playerid:
                type: integer
              ts:
                type: integer
                description: Unix timestamp

    WsRescanEvent:
      type: object
      description: WebSocket event — library scan progress
      properties:
        rescan_event:
          type: array
          items:
            type: object
            properties:
              status:
                type: integer
                enum: [0, 1, 2]
                description: "0=idle, 1=scanning, 2=complete"
              folders:
                type: integer
                nullable: true
              files:
                type: integer
                nullable: true

    WsGlobalSearchResult:
      type: object
      description: WebSocket event — global search result
      properties:
        globalsearch_result:
          type: object
          properties:
            error:
              type: integer
              enum: [0, 1]
            type:
              type: string
              description: Service that provided results (e.g. spotify)
            unique:
              type: string
              description: Correlation ID matching the original request
            result:
              type: object
              properties:
                tracks:
                  $ref: '#/components/schemas/SearchResultSection'
                albums:
                  $ref: '#/components/schemas/SearchResultSection'
                artists:
                  $ref: '#/components/schemas/SearchResultSection'
                playlists:
                  $ref: '#/components/schemas/SearchResultSection'
                shows:
                  $ref: '#/components/schemas/SearchResultSection'
                episodes:
                  $ref: '#/components/schemas/SearchResultSection'
                topresults:
                  $ref: '#/components/schemas/SearchResultSection'
                user:
                  type: string

    SearchResultSection:
      type: object
      properties:
        caption:
          type: string
        count:
          type: integer
        totalitems:
          type: integer
        link:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    # ── MiniServer-only response schemas ─────────────────────────────────────

    SecurePairingResponse:
      type: object
      description: Response to secure/info/pairing
      properties:
        command:
          type: string
          example: "secure/infopairing"
        error:
          type: integer
          description: "0 = paired, -81 = not paired to any master"
          example: -81
        master:
          type: string
          description: Serial number of the paired MiniServer (empty if not paired)
        peers:
          type: array
          items: { type: string }
          description: Additional paired peers (usually empty)

    SecureHelloResponse:
      type: object
      description: Response to secure/hello
      properties:
        command:
          type: string
          example: "secure/hello"
        error:
          type: integer
          example: 0
        public_key:
          type: string
          description: Echo of the public key sent by the MiniServer

    SecureInitResponse:
      type: object
      description: Response to secure/init — contains a legacy session JWT
      properties:
        command:
          type: string
          example: "secure/init"
        error:
          type: integer
          example: 0
        jwt:
          type: string
          description: Legacy JWT string (fixed value, not cryptographically verified)
