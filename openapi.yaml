          description: Search scope tag
        - name: query
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded search query
        - name: limit
          in: path
          required: true
          schema:
            type: integer
        - name: offset
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/globalsearch:
    get:
      tags: [Config – Search]
      summary: Trigger global search (result delivered via WebSocket)
      description: |
        Full form used by the App:
        `audio/cfg/globalsearch/{scopes}/{query}` where `{scopes}` describes the
        services and categories to search with a per-scope result limit and
        `{query}` is the URL-encoded search term.
      responses:
        "200":
          description: Search triggered; result comes via `globalsearch_result` WebSocket event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/globalsearch/describe:
    get:
      tags: [Config – Search]
      summary: Describe / paginate a previous global search result
      responses:
        "200":
          description: Described results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/searchdetails/library/nouser/{query}:
    get:
      tags: [Config – Search]
      summary: Search local library (no account required)
      parameters:
        - name: query
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded search query
      responses:
        "200":
          description: Library search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  # ─── Config – Info ──────────────────────────────────────────────────────────

  /audio/cfg/getplayersdetails:
    get:
      tags: [Config – Info]
      summary: Get details for all players / zones
      responses:
