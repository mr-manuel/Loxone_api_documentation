          description: Audio delay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/cfg/audiodelay/{playerId}/{delay}:
    get:
      tags: [Config – Info]
      summary: Set audio delay for a zone
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
        - name: delay
          in: path
          required: true
          schema:
            type: integer
          description: Delay in milliseconds
      responses:
        "200":
