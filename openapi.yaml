openapi: 3.1.0
info:
  title: Loxone AudioServer – App & MiniServer API
  description: |
    The `audio/…` command protocol spoken **by both the Loxone App and the
    Loxone MiniServer** when communicating with the AudioServer.

    ## Two separate listener ports

    The AudioServer runs **two identical HTTP + WebSocket servers** — one for
    the App and one for the MiniServer.  Both servers handle the same route
    registry, but the MiniServer also sends a set of config-sync and pairing
    commands that the App never sends.

    | Client | Server name | Default port | Purpose |
    |--------|-------------|--------------|---------|
    | **Loxone App** | `appHttp` | `7091` | Zone control, browsing, search |
    | **Loxone MiniServer** | `msHttp` | `7090` | Same as App **+** config sync, pairing, heartbeat |

    The WebSocket **identification string** sent on connect differs:
    - App: `LWSS V 16.1.10.01 | ~API:1.6~ | Session-Token: …`
    - MiniServer: `MINISERVER V LWSS V 16.1.10.01 {mac} | ~API:1.6~ | Session-Token: …`

    When the MiniServer WebSocket connects the AudioServer also emits a
    **server heartbeat** with current state back to the MiniServer.

    ## Tag legend

    | Tag prefix | Used by |
    |------------|---------|
    | *(no prefix)* | **App + MiniServer** — both clients send these |
    | **`MiniServer ›`** | **MiniServer only** — App never sends these |

    ## Command format (shared protocol)
    - Transport: **HTTP GET** or **WebSocket text frame** (same command string)
    - Parameters: **slash-separated path segments**, no request body
    - Audio paths / URIs: **URL-encoded** within the path
    - Response: `{ "{command}_result": <payload>, "command": "<original-path>" }`

    ## Audio Types (`audiotype`)
    | Value | Description |
    |-------|-------------|
    | 0 | File (local) |
    | 1 | Radio |
    | 2 | Playlist |
    | 3 | Line-In |
    | 4 | AirPlay |
    | 5 | Spotify |
    | 6 | Bluetooth |
    | 7 | SoundSuit |

    ## File / Container Types (`type`)
    | Value | Description |
    |-------|-------------|
    | 0 | Unknown |
    | 1 | Folder |
    | 2 | File |
    | 3 | Playlist |
    | 4 | Favorite |
    | 5 | Spotify Connect |
    | 6 | Line-In |
    | 7 | Playlist (browsable) |
    | 8 | Search |
    | 11 | Playlist (editable) |
    | 13 | Playlist (followable) |

    ## Repeat Modes (`plrepeat`)
    | Value | Description |
    |-------|-------------|
    | 0 | Off |
    | 1 | Repeat queue |
    | 3 | Repeat track |

    ## WebSocket Events (server → client push)
    Sent to **all connected clients** (App and MiniServer) on state changes:

    | Event key | Trigger |
    |-----------|---------|
    | `audio_event` | Zone state changed |
    | `audio_queue_event` | Queue contents changed |
    | `roomfavchanged_event` | Room favorites changed |
    | `recentlyplayedchanged_event` | Recently played changed |
    | `rescan_event` | Media library scan progress |
    | `globalsearch_result` | Global search result ready |
    | `audio_sync_event` | Player sync group changed |
    | `lineinchanged_event` | Line-in inputs changed |
    | `playlistchanged_event` | Playlist contents changed |
    | `reloadmusicapp_event` | Client should reload data — payload `{action, cause, needsToReload, user}`; `cause` names the service (e.g. `spotify`), `user` is the affected account or `none` |
    | `service_changed_event` | Configured streaming services changed |
    | `customurl_changed_event` | Custom radio streams changed |
    | `mastervolumechanged_event` | Amplifier master volume changed |
    | `usbchanged_event` | USB storage attached / removed |
    | `restart_event` | AudioServer is restarting |
    | `reboot_event` | AudioServer is rebooting |
    | `dialog_event` | Server requests a user dialog (e.g. error popup) |
    | `hw_event` | Hardware state changed |

  version: "1.0.0"
  contact:
    name: Loxone Audio Server

servers:
  - url: http://{host}:{appPort}
    description: "App server (appHttp) — Loxone App connects here"
    variables:
      host:
        default: "192.168.1.78"
        description: AudioServer hostname or IP
      appPort:
        default: "7091"
        description: App-facing HTTP port (env LOXONE_APP_PORT)
  - url: http://{host}:{msPort}
    description: "MiniServer server (msHttp) — Loxone MiniServer connects here"
    variables:
      host:
        default: "192.168.1.78"
        description: AudioServer hostname or IP
      msPort:
        default: "7090"
        description: MiniServer-facing HTTP port (env LOXONE_MINISERVER_PORT)

tags:
  # ── Shared: used by both App and MiniServer ──────────────────────────────
  - name: Zone Playback
    description: "**App + MiniServer.** Per-zone playback control (play, pause, volume, seek, …)"
  - name: Zone Queue
    description: "**App + MiniServer.** Queue inspection and navigation"
  - name: Zone Content
    description: "**App + MiniServer.** Content playback (services, playlists, library, favorites)"
  - name: Zone Status
    description: "**App + MiniServer.** Zone state retrieval"
  - name: Grouped Playback
    description: "**App + MiniServer.** Commands targeting multiple zones simultaneously"
  - name: Config – Radio
    description: "**App + MiniServer.** Custom radio station management"
  - name: Config – Playlists
    description: "**App + MiniServer.** Playlist management"
  - name: Config – Favorites
    description: "**App + MiniServer.** Room favorites management"
  - name: Config – Services
    description: "**App + MiniServer.** Streaming service configuration (Spotify, SoundSuit, …)"
  - name: Config – Storage
    description: "**App + MiniServer.** Network storage and media library"
  - name: Config – Equalizer
    description: "**App + MiniServer.** Equalizer settings"
  - name: Config – Features
    description: "**App + MiniServer.** Feature toggles (AirPlay, Spotify Connect, TuneIn)"
  - name: Config – Search
    description: "**App + MiniServer.** Search across all services and library"
  - name: Config – Info
    description: "**App + MiniServer.** Server and player information"
  # ── MiniServer only ──────────────────────────────────────────────────────
  - name: "MiniServer › Pairing & Auth"
    description: |
      **MiniServer only.** Bootstrap / pairing handshake sent by the MiniServer
      immediately after establishing a WebSocket connection.
      The App never sends these commands.
  - name: "MiniServer › Config Sync"
    description: |
      **MiniServer only.** Configuration synchronisation commands sent by the
      MiniServer to push or pull zone names, volumes, timestamps, and other
      settings.  The App never sends these commands.

paths:

  # ─── Zone Status ────────────────────────────────────────────────────────────

  /audio/{zoneId}/status:
    get:
      tags: [Zone Status]
      summary: Get zone status
      description: Returns the full current state of a zone including playback mode, metadata, volume, and repeat/shuffle settings.
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: Zone status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneStatusResponse'

  /audio/{zoneId}/getqueue:
    get:
      tags: [Zone Queue]
      summary: Get queue (first 50 items)
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'

  /audio/{zoneId}/getqueue/{start}/{limit}:
    get:
      tags: [Zone Queue]
      summary: Get queue (paginated)
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: start
          in: path
          required: true
          schema:
            type: integer
            default: 0
          description: Zero-based start index
        - name: limit
          in: path
          required: true
          schema:
            type: integer
            default: 50
          description: Maximum number of items to return
      responses:
        "200":
          description: Queue page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'

  /audio/{zoneId}/recent:
    get:
      tags: [Zone Status]
      summary: Get recently played items
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: Recently played list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/recent/clear:
    get:
      tags: [Zone Status]
      summary: Clear recently played history
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  # ─── Zone Playback Control ──────────────────────────────────────────────────

  /audio/{zoneId}/play:
    get:
      tags: [Zone Playback]
      summary: Start / resume playback
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/pause:
    get:
      tags: [Zone Playback]
      summary: Pause playback
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/resume:
    get:
      tags: [Zone Playback]
      summary: Resume playback
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/on:
    get:
      tags: [Zone Playback]
      summary: Power zone on
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/off:
    get:
      tags: [Zone Playback]
      summary: Power zone off
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/volume/{value}:
    get:
      tags: [Zone Playback]
      summary: Set volume (absolute or relative)
      description: |
        Sets the zone volume. `value` is either an **absolute** level (`0`–`100`)
        or a **relative** step prefixed with `+` or `-` (e.g. `volume/+5`,
        `volume/-5`). The official App uses the relative form for its
        volume-step buttons.
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: value
          in: path
          required: true
          schema:
            type: string
            example: "+5"
          description: "Absolute volume level (0–100) or relative step (`+{n}` / `-{n}`)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/mastervolume/{value}:
    get:
      tags: [Zone Playback]
      summary: Set amplifier master volume
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: value
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/position/{seconds}:
    get:
      tags: [Zone Playback]
      summary: Seek to position
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: seconds
          in: path
          required: true
          schema:
            type: number
            minimum: 0
          description: Target position in seconds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/shuffle/{mode}:
    get:
      tags: [Zone Playback]
      summary: Set shuffle mode
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: mode
          in: path
          required: true
          schema:
            type: string
            enum: [enable, disable, on, off, "1", "0"]
          description: Shuffle on/off
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/repeat/{mode}:
    get:
      tags: [Zone Playback]
      summary: Set repeat mode
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: mode
          in: path
          required: true
          schema:
            type: integer
            enum: [0, 1, 3]
          description: "0 = off, 1 = repeat queue, 3 = repeat track"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/loudness:
    get:
      tags: [Zone Playback]
      summary: Get loudness state
      description: |
        Returns whether loudness compensation is active for the zone.
        Requires AudioServer firmware ≥ **18.1.0.0** (App feature gate `LoudnessSwitch`).
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: Loudness state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/loudness/{value}:
    get:
      tags: [Zone Playback]
      summary: Enable / disable loudness
      description: |
        Switches loudness compensation for the zone on or off.
        Requires AudioServer firmware ≥ **18.1.0.0** (App feature gate `LoudnessSwitch`).
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: value
          in: path
          required: true
          schema:
            type: integer
            enum: [0, 1]
          description: "1 = on, 0 = off"
      responses:
        "200":
          description: Loudness set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/queueplus:
    get:
      tags: [Zone Queue]
      summary: Skip to next track
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/queueminus:
    get:
      tags: [Zone Queue]
      summary: Skip to previous track
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/queueadd/{itemId}:
    get:
      tags: [Zone Queue]
      summary: Append item to end of queue
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: itemId
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded audio path / item ID to append
      responses:
        "200":
          description: Item appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/queueinsert/{itemId}:
    get:
      tags: [Zone Queue]
      summary: Insert item after current track
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: itemId
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded audio path / item ID to insert
      responses:
        "200":
          description: Item inserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/queue/play/{queueItemId}:
    get:
      tags: [Zone Queue]
      summary: Play a specific queue item
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: queueItemId
          in: path
          required: true
          schema:
            type: string
          description: Unique ID of the queue item (from `getqueue`)
      responses:
        "200":
          description: Playback jumped to item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/queue/remove/{queueItemId}:
    get:
      tags: [Zone Queue]
      summary: Remove a queue item
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: queueItemId
          in: path
          required: true
          schema:
            type: string
          description: Unique ID of the queue item (from `getqueue`)
      responses:
        "200":
          description: Item removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/queue/move/{queueItemId}/before/{targetItemId}:
    get:
      tags: [Zone Queue]
      summary: Move a queue item
      description: Moves a queue item so it is placed **before** the given target item.
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: queueItemId
          in: path
          required: true
          schema:
            type: string
          description: Unique ID of the queue item to move
        - name: targetItemId
          in: path
          required: true
          schema:
            type: string
          description: Unique ID of the queue item to move it before
      responses:
        "200":
          description: Item moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  # ─── Zone Content ───────────────────────────────────────────────────────────

  /audio/{zoneId}/serviceplay/{service}/{user}/{audiopath}:
    get:
      tags: [Zone Content]
      summary: Play content from a streaming service
      description: |
        Known service IDs used by the official App: `spotify`, `radio` (TuneIn),
        `custom_stream`, `soundsuit`, `loxoneradio` (Loxone Radio, firmware ≥ 17.0.0.0;
        user is always `noUser`), `local`, `lms`.

        Optional trailing path segments (appended by the App):
        - `parentid/{id}/{idx}` or `parentpath/{path}/{idx}` — playback context so
          the whole parent container continues after the item (**Spotify only**)
        - `noshuffle` — see dedicated route below
        - `?q&{base64url("enforceUser=true")}` — forces the given service account
          (firmware ≥ 15.5.01.13, App feature gate `PlayWithEnforcedUser`)
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: service
          in: path
          required: true
          schema:
            type: string
            example: spotify
          description: Service name (e.g. `spotify`, `radio`, `soundsuit`, `loxoneradio`)
        - name: user
          in: path
          required: true
          schema:
            type: string
          description: Service username / account identifier
        - name: audiopath
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded audio path / URI (e.g. `spotify%3Atrack%3A4iV5W9uYEdYUVa79Axb7Rh`)
      responses:
        "200":
          description: Playback started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlayResponse'

  /audio/{zoneId}/serviceplay/{service}/{user}/{audiopath}/noshuffle:
    get:
      tags: [Zone Content]
      summary: Play service content without shuffle
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: user
          in: path
          required: true
          schema:
            type: string
        - name: audiopath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Playback started (shuffle off)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlayResponse'

  /audio/{zoneId}/playlist/play/{audiopath}:
    get:
      tags: [Zone Content]
      summary: Play a playlist
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: audiopath
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded playlist path
      responses:
        "200":
          description: Playback started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/library/play/{audiopath}:
    get:
      tags: [Zone Content]
      summary: Play from local library
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: audiopath
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded library path
      responses:
        "200":
          description: Playback started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/playurl/{url}:
    get:
      tags: [Zone Content]
      summary: Play an arbitrary URL
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: url
          in: path
          required: true
          schema:
            type: string
          description: URL-encoded stream URL
      responses:
        "200":
          description: Playback started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/linein:
    get:
      tags: [Zone Content]
      summary: Switch to default line-in input
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/linein/{inputId}:
    get:
      tags: [Zone Content]
      summary: Switch to specific line-in input
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: inputId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/{zoneId}/roomfav/play/{favoriteId}:
    get:
      tags: [Zone Content]
      summary: Play a room favorite
      description: |
        Optional trailing path segments (appended by the App):
        - `{username}` — service account to play the favorite with
        - `noshuffle` — start without shuffle
        - `?q&{base64url("enforceUser=true")}` — forces the given service account
          (firmware ≥ 15.5.01.13, App feature gate `PlayWithEnforcedUser`)
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: favoriteId
          in: path
          required: true
          schema:
            type: integer
          description: Favorite slot index (1-based)
      responses:
        "200":
          description: Playback started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomFavPlayResponse'

  /audio/{zoneId}/roomfav/play/{favoriteId}/fade/{durationMs}:
    get:
      tags: [Zone Content]
      summary: Play a room favorite with fade-in
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - name: favoriteId
          in: path
          required: true
          schema:
            type: integer
        - name: durationMs
          in: path
          required: true
          schema:
            type: integer
          description: Fade-in duration in milliseconds
      responses:
        "200":
          description: Playback started with fade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomFavPlayResponse'

  /audio/{zoneId}/roomfav/plus:
    get:
      tags: [Zone Content]
      summary: Play next favorite in rotation
      parameters:
        - $ref: '#/components/parameters/zoneId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  # ─── Grouped Playback ───────────────────────────────────────────────────────

  /audio/grouped/play:
    get:
      tags: [Grouped Playback]
      summary: Start playback on multiple zones
      description: Zone IDs are passed as a comma-separated list in the query or path.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/grouped/pause:
    get:
      tags: [Grouped Playback]
      summary: Pause multiple zones
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/grouped/volume/{zoneIds}/{value}:
    get:
      tags: [Grouped Playback]
      summary: Set volume on multiple zones
      parameters:
        - name: zoneIds
          in: path
          required: true
          schema:
            type: string
            example: "1,2,3"
          description: Comma-separated zone IDs
        - name: value
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'

  /audio/grouped/playuploadedfile/{filename}/{playerIds}/{volume}:
    get:
      tags: [Grouped Playback]
      summary: Play an uploaded audio file on multiple zones
      parameters:
        - name: filename
